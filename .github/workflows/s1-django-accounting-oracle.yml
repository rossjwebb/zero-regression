# SPDX-License-Identifier: Apache-2.0
# This branch has subjects/django-accounting/oracle.py. Skip is not allowed.
# A match is a replay of recorded traces, not paper S1.
name: S1 django-accounting oracle

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.12.3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Run the replay oracle
        run: |
          set -euo pipefail
          expected='ORACLE OK pin=2e61776a653e719a4c15578ab385603a6066c2b6 cases=27 replay-only'
          output=$(python3.12 subjects/django-accounting/oracle.py)
          printf '%s\n' "$output"
          if [ "$output" != "$expected" ]; then
            echo "ORACLE FAILURE: stdout was not the required replay-only OK line" >&2
            echo "expected: $expected" >&2
            echo "got: $output" >&2
            exit 1
          fi
