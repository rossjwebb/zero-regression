# SPDX-License-Identifier: Apache-2.0
# Pin checks always run on this branch. The compile path lives in
# s3-carddemo-compile.yml and must not skip. The job path lives in
# s3-carddemo-posttran.yml and must not skip.
# Exit 2 after a successful cobc compile is the harness compile-only
# job not-run code (posttran_job=not-run), not a GnuCOBOL error. A real cobc
# failure is S3 COBC FAIL / work/COBC-FAIL and the compile job fails.
name: S3 CardDemo pins

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.12.3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Require the pin files
        run: |
          set -euo pipefail
          if [[ ! -f subjects/carddemo/check-pins.py ]]; then
            echo "S3 FAIL-CLOSED: subjects/carddemo/check-pins.py is missing. Skip is not a pass on this branch." >&2
            exit 1
          fi

      - name: Verify pins
        run: |
          python3.12 subjects/carddemo/check-pins.py
          python3.12 -m unittest tests.test_carddemo_pins tests.test_carddemo_toolchain tests.test_carddemo_posttran
