# SPDX-License-Identifier: Apache-2.0
name: PR checks

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  verify-and-oracle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.12.3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Install the harness CLI
        run: python3.12 -m pip install -e .

      - name: Verify executed fixture chains
        run: |
          python3.12 ./verify.py fixtures/accounting-service/evidence.jsonl
          python3.12 ./verify.py fixtures/accounting-service/pre-remediation/evidence.jsonl
          python3.12 ./verify.py fixtures/accounting-service/superseded/publish-4/evidence.jsonl
          zero-regression verify fixtures/accounting-service/evidence.jsonl

      - name: Verify public S1–S3 posture packs
        run: |
          set -euo pipefail
          zero-regression verify subjects/django-accounting
          zero-regression verify subjects/commons-csv
          zero-regression verify subjects/carddemo
          python3.12 -m unittest tests.test_cli tests.test_cli_public

      - name: Certify S2 score-free evidence
        run: |
          set -euo pipefail
          zero-regression certify subjects/commons-csv


      - name: Run django-accounting replay oracle
        run: |
          set -euo pipefail
          if [[ ! -f subjects/django-accounting/oracle.py ]]; then
            echo "PR CHECKS FAIL-CLOSED: subjects/django-accounting/oracle.py is missing. Skip is not a pass." >&2
            exit 1
          fi
          expected='ORACLE OK pin=2e61776a653e719a4c15578ab385603a6066c2b6 cases=27 replay-only'
          output=$(python3.12 subjects/django-accounting/oracle.py)
          printf '%s\n' "$output"
          if [ "$output" != "$expected" ]; then
            echo "ORACLE FAILURE: stdout was not the replay-only OK line" >&2
            echo "expected: $expected" >&2
            echo "got: $output" >&2
            exit 1
          fi

      - name: Run the Stage C discrimination gate
        run: |
          set -euo pipefail
          if [[ ! -f subjects/django-accounting/check-discrimination.py ]]; then
            echo "PR CHECKS FAIL-CLOSED: subjects/django-accounting/check-discrimination.py is missing. Skip is not a pass." >&2
            exit 1
          fi
          python3.12 subjects/django-accounting/check-discrimination.py
