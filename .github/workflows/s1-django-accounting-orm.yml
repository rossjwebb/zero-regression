# SPDX-License-Identifier: Apache-2.0
# S1 ORM / SQL path. Skip is not allowed.
# Replay oracle + Stage C + Stage D must stay green.
# A missing Django pin is fail-closed, not a pass.
# This is not paper S1 and stores no mutation score.
name: S1 django-accounting ORM path

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  orm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.12.3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Require the ORM files
        run: |
          set -euo pipefail
          if [[ ! -f subjects/django-accounting/check-orm.py ]]; then
            echo "S1 ORM FAIL-CLOSED: check-orm.py is missing." >&2
            exit 1
          fi
          if [[ ! -f subjects/django-accounting/orm/requirements.lock ]]; then
            echo "S1 ORM FAIL-CLOSED: requirements.lock is missing." >&2
            exit 1
          fi

      - name: Install the pinned Django lock
        run: |
          set -euo pipefail
          python3.12 -m pip install --require-hashes -r subjects/django-accounting/orm/requirements.lock

      - name: Good pin must still replay
        run: |
          set -euo pipefail
          expected='ORACLE OK pin=2e61776a653e719a4c15578ab385603a6066c2b6 cases=27 replay-only'
          output=$(python3.12 subjects/django-accounting/oracle.py)
          printf '%s\n' "$output"
          if [ "$output" != "$expected" ]; then
            echo "ORACLE FAILURE: stdout was not the required replay-only OK line" >&2
            echo "expected: $expected" >&2
            echo "got: $output" >&2
            exit 1
          fi

      - name: Stage C discrimination must stay green
        run: python3.12 subjects/django-accounting/check-discrimination.py

      - name: Stage D gate must stay green
        run: python3.12 subjects/django-accounting/check-stage-d.py

      - name: ORM org-aggregates gate
        run: python3.12 subjects/django-accounting/check-orm.py

      - name: ORM unit tests
        run: python3.12 -m unittest tests.test_django_accounting_orm
