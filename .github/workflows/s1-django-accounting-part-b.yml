# SPDX-License-Identifier: Apache-2.0
# Part B honesty gate. Skip is not allowed.
# Still requires the existing replay-only oracle stdout exactly.
# This is not paper S1 and stores no mutation score.
name: S1 django-accounting Part B posture

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  part-b:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.12.3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Require the Part B files
        run: |
          set -euo pipefail
          if [[ ! -f subjects/django-accounting/oracle.py ]]; then
            echo "S1 PART B FAIL-CLOSED: oracle.py is missing. Skip is not a pass on this branch." >&2
            exit 1
          fi
          if [[ ! -f subjects/django-accounting/check-part-b.py ]]; then
            echo "S1 PART B FAIL-CLOSED: check-part-b.py is missing. Skip is not a pass on this branch." >&2
            exit 1
          fi
          if [[ ! -f subjects/django-accounting/evidence/s1-part-b-posture.json ]]; then
            echo "S1 PART B FAIL-CLOSED: s1-part-b-posture.json is missing. Skip is not a pass on this branch." >&2
            exit 1
          fi

      - name: Run the replay oracle (exact stdout)
        run: |
          set -euo pipefail
          expected='ORACLE OK pin=2e61776a653e719a4c15578ab385603a6066c2b6 cases=27 replay-only'
          output=$(python3.12 subjects/django-accounting/oracle.py)
          printf '%s\n' "$output"
          if [ "$output" != "$expected" ]; then
            echo "ORACLE FAILURE: stdout was not the required replay-only OK line" >&2
            echo "expected: $expected" >&2
            echo "got: $output" >&2
            exit 1
          fi

      - name: Run the shared arm-oracle receipt script
        run: python3.12 subjects/django-accounting/evidence/arms/run-arm-oracle.py

      - name: Run the Part B honesty gate
        run: python3.12 subjects/django-accounting/check-part-b.py

      - name: Unit tests for honesty locks
        run: python3.12 -m unittest tests.test_django_accounting_part_b
